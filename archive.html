<meta charset="utf-8"><script src="harpy-style.js"></script>



<script>
  const all = {
    2024: [
      {src:"piranha",     title:"Fish Series",    href:"pastelfish"},
      {src:"seacollage",  title:"Rockweed One"},
      {src:"nurseshark",  title:"Nurse Shark"},
      {src:"thelightinthemirror", title:"The Light in the Mirror"},
      {src:"sendsusanourlove", title:"Send Susan Our Love"},
      {src:"tvstudy", title:"Will Graham"},
      {src:"gull", title:"Gull"},
      {src:"dermotographicalnightmare", title:"Derm. Nightmare"},
      {src:"walkingonthelake", title:"Walking on the Lake"},
      {src:"totallytruthful", title:"Totally Truthful", href:"totallytruthful"},
    ],

    2025: [
      {src:"williamstown", title:"Williamstown"},
    ],

    2026: [
      {src:"perezcenterforthearts", title:"Perez Center", href:"perezcenterforthearts"},
      {src:"driftwood", title:"Driftwood", href:"driftwood"},
      {src:"untitled", title:"Seashell", href:"untitled"},

    ]
  };

  let button_list = "";
  let image_list = "";
  for (const year in all) {
    button_list += `<button class="btn" onclick="filterSelection('${year}')"> ${year}</button>`;
    for (const image of all[year]) {
      const link = image.href ? `archivetext/${image.href}.html` : `art/${image.src}.png`;
      image_list += `<div class="filterDiv ${year}">[<img src="art/${image.src}tn.png">](${link})_${image.title}_</div>`;
    }
  }

  document.write(`
<div id="filterbuttons">
  <button class="btn active" onclick="filterSelection('all')"> Show all</button>
  ${button_list}
</div>`);

  document.write(`<div class="archivefiltercontainers">${image_list}</div>`);
</script>

<script>

var btnContainer = document.getElementById("filterbuttons");
var btns = btnContainer.getElementsByClassName("btn");
for (var i = 0; i < btns.length; i++) {
  btns[i].addEventListener("click", function() {
    var current = document.getElementsByClassName("active");
    current[0].className = current[0].className.replace(" active", "");
    this.className += " active";
  });
}

</script>
